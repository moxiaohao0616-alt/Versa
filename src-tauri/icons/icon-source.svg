<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Versa app mark: two converging git branches forming a V.
       Transparent background; left stroke is brand green, right stroke is
       neutral dark. Matches the welcome-screen Logo component. -->

  <!-- Left branch — Versa green -->
  <path d="M 280 256 L 512 800"
        stroke="#639922" stroke-width="112"
        stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <circle cx="280" cy="256" r="96" fill="#639922" />

  <!-- Right branch — neutral dark -->
  <path d="M 744 256 L 512 800"
        stroke="#1a1a18" stroke-width="112"
        stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <circle cx="744" cy="256" r="96" fill="#1a1a18" />
</svg>
