<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Versa macOS-style app icon.
       macOS Big Sur+ requires the squircle (continuous-corner rounded
       rectangle) to be baked into the icon itself — the OS does NOT mask.
       rx=229 (≈22.4% of 1024) approximates Apple's icon-template radius.
       The V mark is inset to ~70% of the canvas, giving comfortable
       padding from the rounded corners. Dark tile + bright green + off-white
       to fit alongside other dev-tool icons (VS Code, Warp, Zed). -->

  <!-- Dark slate tile -->
  <rect width="1024" height="1024" rx="229" ry="229" fill="#1c1c1c" />

  <!-- Left branch — brighter Versa green for dark-tile contrast -->
  <path d="M 308 304 L 512 750"
        stroke="#7eb83a" stroke-width="100"
        stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <circle cx="308" cy="304" r="80" fill="#7eb83a" />

  <!-- Right branch — off-white for dark-tile contrast -->
  <path d="M 716 304 L 512 750"
        stroke="#e8e8e8" stroke-width="100"
        stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <circle cx="716" cy="304" r="80" fill="#e8e8e8" />
</svg>
