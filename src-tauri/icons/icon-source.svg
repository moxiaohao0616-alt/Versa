<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ab02b" />
      <stop offset="1" stop-color="#4d7a1a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" />
    </filter>
  </defs>

  <!-- App icon background: rounded square, brand-green gradient.
       Corner radius ~22% matches Apple's macOS icon shape. -->
  <rect width="1024" height="1024" rx="224" ry="224" fill="url(#bg)" />

  <!-- Subtle inner highlight so the icon doesn't look flat. -->
  <rect width="1024" height="1024" rx="224" ry="224"
        fill="white" opacity="0.06" />

  <!-- Soft glow behind the mark, for a tiny bit of depth. -->
  <g filter="url(#glow)" opacity="0.35">
    <path d="M 320 296 L 512 808 L 704 296"
          stroke="white" stroke-width="100" fill="none"
          stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- The V — two converging branches meeting at the bottom apex. -->
  <path d="M 320 296 L 512 808 L 704 296"
        stroke="white" stroke-width="92" fill="none"
        stroke-linecap="round" stroke-linejoin="round" />

  <!-- Top commit dots, framing the two endpoints. -->
  <circle cx="320" cy="296" r="78" fill="white" />
  <circle cx="704" cy="296" r="78" fill="white" />
</svg>
