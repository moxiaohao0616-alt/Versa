# Cross-platform build matrix. Runs on every push/PR to verify Versa still
# builds on macOS / Windows / Linux. Produces tagged artifacts on release
# tags (v*) and uploads them to the corresponding GitHub Release.
#
# Required secrets for full functionality:
#   TAURI_SIGNING_PRIVATE_KEY          updater key (mandatory for releases)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  blank if generated with empty password
# Optional macOS signing/notarization:
#   APPLE_CERTIFICATE                  base64 of the Developer ID .p12
#   APPLE_CERTIFICATE_PASSWORD         password for the .p12
#   APPLE_SIGNING_IDENTITY             e.g. "Developer ID Application: Name (TEAMID)"
#   APPLE_ID                           Apple ID email
#   APPLE_PASSWORD                     app-specific password
#   APPLE_TEAM_ID                      team ID
# Optional Windows signing (left empty for now — Smart-Screen warning until
# we buy a code-signing cert).

name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # needed to create / upload to Releases on tags

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            label: macos-arm64
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
            label: macos-x64
          - platform: ubuntu-22.04
            args: ''
            label: linux-x64
          - platform: windows-latest
            args: ''
            label: windows-x64

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: setup rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: install linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libssl-dev

      - name: install node deps
        run: npm ci

      # ── macOS code signing (only when we have the cert) ──────────────
      # If APPLE_CERTIFICATE is unset, we skip importing and tauri-action
      # below will still produce an unsigned .app. Public-beta releases
      # will fail Gatekeeper on first launch; users right-click → open.
      - name: import macOS signing cert
        if: matrix.platform == 'macos-latest' && env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 build.keychain
          echo "$APPLE_CERTIFICATE" | base64 --decode > cert.p12
          security import cert.p12 \
            -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm cert.p12

      # Diagnostic + capability detection in a single bash step. We print
      # boolean presence for each optional secret AND publish step outputs
      # so subsequent steps can conditionally branch. Avoids the
      # `secrets.* == ''` expression in `if:`, which can trip workflow
      # parsing on some Actions runner versions.
      - name: probe secrets
        id: secrets
        shell: bash
        env:
          UPD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          APL: ${{ secrets.APPLE_CERTIFICATE }}
        run: |
          echo "=== Versa CI secrets ==="
          if [ -n "$UPD" ]; then
            echo "  ✓ TAURI_SIGNING_PRIVATE_KEY is set"
            echo "has_updater=true" >> "$GITHUB_OUTPUT"
          else
            echo "  ✗ TAURI_SIGNING_PRIVATE_KEY is NOT set"
            echo "has_updater=false" >> "$GITHUB_OUTPUT"
            echo "::warning ::TAURI_SIGNING_PRIVATE_KEY missing — will skip updater artifact signing."
          fi
          if [ -n "$APL" ]; then
            echo "  ✓ APPLE_CERTIFICATE is set"
          else
            echo "  ✗ APPLE_CERTIFICATE is NOT set"
          fi
          echo "========================"

      # If the updater key isn't set, flip createUpdaterArtifacts off so
      # tauri build doesn't try to sign and abort.
      - name: disable updater artifacts when no key
        if: steps.secrets.outputs.has_updater == 'false'
        shell: bash
        run: |
          node -e "const fs=require('fs');const p='src-tauri/tauri.conf.json';const c=JSON.parse(fs.readFileSync(p,'utf8'));c.bundle=c.bundle||{};c.bundle.createUpdaterArtifacts=false;fs.writeFileSync(p,JSON.stringify(c,null,2));console.log('Patched tauri.conf.json: createUpdaterArtifacts=false');"

      - name: build & bundle
        uses: tauri-apps/tauri-action@v0
        env:
          # Updater key — required for `createUpdaterArtifacts: true` to
          # actually emit signed `.tar.gz.sig` files.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS signing/notarization (no-ops when secrets are empty)
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: 'Versa ${{ github.ref_name }}'
          releaseBody: '_See CHANGELOG._'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: upload non-release artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: versa-${{ matrix.label }}
          path: |
            src-tauri/target/**/release/bundle/macos/*.app.tar.gz
            src-tauri/target/**/release/bundle/macos/*.app.tar.gz.sig
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/appimage/*.AppImage.tar.gz
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe
          if-no-files-found: ignore
